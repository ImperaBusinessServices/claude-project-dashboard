name: Build macOS app

# Builds a Developer-ID-signed AND Apple-notarized universal .dmg on a
# GitHub-hosted Mac (electron-builder can't build/sign a Mac app from Windows).
# The signing identity + notarization credentials come from encrypted repo
# secrets — nothing sensitive is in this file or the repo:
#   CSC_LINK             base64 of the Developer ID Application .p12 (cert+key+G2 intermediate)
#   CSC_KEY_PASSWORD     password for that .p12
#   APPLE_API_KEY_P8_B64 base64 of the App Store Connect API .p8 (notarization only)
#   APPLE_API_ISSUER     App Store Connect Issuer ID
# Manual-trigger only.

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note describing this build"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-mac:
    name: Build signed + notarized macOS .dmg (universal)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Notarization uses the App Store Connect API key. @electron/notarize's
      # notarytool wants the .p8 as a FILE PATH (not base64), so decode it here.
      - name: Write App Store Connect API key to disk
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "${{ secrets.APPLE_API_KEY_P8_B64 }}" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_75386VJRAQ.p8"

      # electron-builder v26 signs (CSC_LINK auto-imports the .p12 into a temp
      # keychain) and notarizes natively (mac.notarize.teamId + APPLE_API_* env),
      # then staples the .app.
      - name: Build, sign & notarize
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/private_keys/AuthKey_75386VJRAQ.p8
          APPLE_API_KEY_ID: "75386VJRAQ"
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npx electron-builder --mac --publish never

      # The .app inside is already stapled; staple the .dmg container too so it
      # passes Gatekeeper offline. Verify the result.
      - name: Staple & verify the .dmg
        run: |
          set -euo pipefail
          DMG="$(ls dist/*.dmg | head -n1)"
          echo "Stapling $DMG"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl -a -t open --context context:primary-signature -vvv "$DMG" || true

      - name: List build output
        run: ls -lh dist

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-project-dashboard-mac
          path: dist/*.dmg
          if-no-files-found: error
